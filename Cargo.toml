[workspace]
members = ["ldso", "libc", "utils"]

[profile.dev]
panic = "abort"
overflow-checks = false
opt-level = 2

[profile.release]
panic = "abort"
strip = "symbols"
opt-level = "s"

[package]
name = "keel-rt"
version = "0.8.0"
edition = "2021"
description = "A Rust musl-compatible libc with a dynamic linker"
license = "BSD-3-Clause"
repository = "https://github.com/mengzhuo/keel"
readme = "README.md"

[[bin]]
name = "keel"
path = "src/main.rs"
