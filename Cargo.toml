[workspace]
members = ["libc", "utils", "tools/header-check"]

[profile.dev]
panic = "abort"
overflow-checks = false
opt-level = 2

[profile.release]
panic = "abort"
strip = "symbols"
opt-level = "s"

[package]
name = "keel-rt"
version = "0.1.6"
rust-version = "1.99"
edition = "2021"
description = "A Rust musl-compatible libc with a dynamic linker"
license = "BSD-3-Clause"
repository = "https://github.com/mengzhuo/keel"
readme = "README.md"
# The standalone mapper includes two loader sources from the sibling libc
# package.  Cargo excludes nested packages by default, so list them
# explicitly to keep the published keel-rt tarball self-contained.
include = [
    "src/**",
    "Cargo.toml",
    "README.md",
    "LICENSE",
    "NOTICE",
    "libc/src/ldso/elf_common.rs",
    "libc/src/ldso/startup_common.rs",
    "libc/src/arch_syscalls.rs",
]

[[bin]]
name = "keel"
path = "src/main.rs"
