# Manual workload run.  CI uses workloads-prepare.yml and
# workloads-matrix.yml directly, with prepare running in parallel with
# build-and-test.  This wrapper keeps the "Run workflow" entry point by doing
# prepare first and then the matrix in one workflow run.

name: Workloads

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  prepare:
    name: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/workloads-prepare.yml

  matrix:
    name: matrix
    needs: prepare
    permissions:
      contents: read
    uses: ./.github/workflows/workloads-matrix.yml
