name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always
  RUST_TEST_THREADS: "1"

jobs:
  # First gate: the hand-maintained headers and the Rust sources are
  # independent sources of truth, so fail fast if a numeric macro drifts.
  header-consistency:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu

      - name: Check headers against Rust constants
        run: cargo run -q -p keel-header-check -- --include include

  build-and-test:
    needs: header-consistency
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
          # Native arm64 runners.
          - arch: aarch64
            os: ubuntu-24.04-arm
          # Native riscv64 hardware from the RISE RISC-V Runners service.
          # Requires the RISE GitHub App: https://github.com/apps/rise-risc-v-runners
          # Disabled for now: the runner does not come up. Re-enable together
          # with the riscv64-only steps below.
          # - arch: riscv64
          #   os: ubuntu-24.04-riscv
    runs-on: ${{ matrix.os }}
    # RISC-V hardware is scarce and slower; keep it non-blocking and capped.
    continue-on-error: ${{ matrix.arch == 'riscv64' }}
    timeout-minutes: ${{ matrix.arch == 'riscv64' && 10 || 360 }}
    env:
      LIBC_TEST_DIR: /tmp/libc-test
      # Pin upstream libc-test so an unrelated commit cannot change results.
      LIBC_TEST_SHA: b7ec467969a53756258778fa7d9b045f912d1c93
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-registry-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}

      - name: Resolve libc-test revision
        id: libc_test
        run: echo "sha=$LIBC_TEST_SHA" >> "$GITHUB_OUTPUT"

      - name: Cache libc-test sources
        uses: actions/cache@v6
        with:
          path: /tmp/libc-test
          key: libc-test-${{ runner.os }}-${{ matrix.arch }}-${{ steps.libc_test.outputs.sha }}

      - name: Fetch libc-test sources
        run: |
          if [ ! -d /tmp/libc-test/src ] || \
             [ "$(git -C /tmp/libc-test rev-parse HEAD 2>/dev/null)" != "${{ steps.libc_test.outputs.sha }}" ]; then
            rm -rf /tmp/libc-test
            git clone --depth 1 https://github.com/kraj/libc-test /tmp/libc-test
          fi

      - name: Build all artifacts
        run: cargo build --workspace

      - name: Run integration tests
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee /tmp/integration-tests.log

      - name: Report failed tests
        if: failure()
        run: |
          grep -E '^test .* FAILED|FAILED|panicked at|error: test failed' /tmp/integration-tests.log | tail -80 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Install riscv64 musl target
        if: matrix.arch == 'riscv64'
        run: rustup target add riscv64gc-unknown-linux-musl

      - name: Run riscv64 smoke suite natively
        if: matrix.arch == 'riscv64'
        env:
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: ./scripts/riscv-smoke.sh

      # regression/functional run inside cargo test via tests/libc_test_regression.rs
      # and libc_test_functional.rs.
      - name: Run libc-test API suite
        run: |
          cd scripts/libc-test-harness
          ./run.sh api

      - name: Run libc-test math suite
        if: matrix.arch == 'x86_64'
        run: |
          cd scripts/libc-test-harness
          ./run.sh math

  libc-test-cross:
    name: libc-test-cross (${{ matrix.arch }})
    runs-on: ubuntu-latest
    # The bring-up targets are still non-blocking; promote to blocking once
    # they have a few green weeks.
    continue-on-error: true
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            targets: aarch64-unknown-linux-gnu
            packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            cross_cc: aarch64-linux-gnu-gcc
          - arch: riscv64
            targets: riscv64gc-unknown-linux-gnu
            packages: gcc-riscv64-linux-gnu libc6-dev-riscv64-cross
            cross_cc: riscv64-linux-gnu-gcc
          - arch: powerpc64le
            targets: powerpc64le-unknown-linux-gnu
            packages: gcc-powerpc64le-linux-gnu libc6-dev-ppc64el-cross
            cross_cc: powerpc64le-linux-gnu-gcc
          - arch: loongarch64
            # Ubuntu has no unversioned gcc-loongarch64-linux-gnu meta package.
            targets: loongarch64-unknown-linux-gnu
            packages: gcc-14-loongarch64-linux-gnu libc6-dev-loong64-cross
            cross_cc: loongarch64-linux-gnu-gcc-14
    env:
      LIBC_TEST_DIR: /tmp/libc-test
      LIBC_TEST_SHA: b7ec467969a53756258778fa7d9b045f912d1c93
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Install cross compiler, target libc and qemu
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }} qemu-user

      - name: Cache libc-test sources
        uses: actions/cache@v6
        with:
          path: /tmp/libc-test
          key: libc-test-${{ runner.os }}-${{ matrix.arch }}-b7ec467969a53756258778fa7d9b045f912d1c93

      - name: Fetch libc-test sources
        run: |
          if [ ! -d /tmp/libc-test/src ] || \
             [ "$(git -C /tmp/libc-test rev-parse HEAD 2>/dev/null)" != "$LIBC_TEST_SHA" ]; then
            rm -rf /tmp/libc-test
            git clone --depth 1 https://github.com/kraj/libc-test /tmp/libc-test
          fi

      - name: Run functional, regression and API suites
        env:
          CROSS_CC: ${{ matrix.cross_cc }}
        run: |
          set -e
          ./scripts/libc-test-harness/cross-run.sh ${{ matrix.arch }} functional
          ./scripts/libc-test-harness/cross-run.sh ${{ matrix.arch }} regression
          ./scripts/libc-test-harness/cross-run.sh ${{ matrix.arch }} api

  macro-parity:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - name: Install cross compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu g++-aarch64-linux-gnu g++-riscv64-linux-gnu make curl

      - name: Cache musl 1.2.6 headers
        uses: actions/cache@v6
        with:
          path: ~/.cache/keel
          key: musl-1.2.6-headers-v1

      - name: Check macro expansion parity
        run: ./scripts/macro-parity.sh

  cross-arch:
    name: cross-arch (${{ matrix.arch }})
    runs-on: ubuntu-latest
    continue-on-error: true
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: riscv64
            targets: riscv64gc-unknown-linux-musl
            packages: gcc-riscv64-linux-gnu
            cross_cc: ""
            script: ./scripts/riscv-smoke.sh
          - arch: powerpc64le
            # libc.so is built for the gnu target: the stable musl targets
            # cannot emit a cdylib.  The musl target supplies the CRT objects.
            targets: powerpc64le-unknown-linux-gnu,powerpc64le-unknown-linux-musl
            packages: gcc-powerpc64le-linux-gnu libc6-dev-ppc64el-cross
            cross_cc: ""
            script: ./scripts/cross-smoke.sh powerpc64le
          - arch: loongarch64
            targets: loongarch64-unknown-linux-gnu,loongarch64-unknown-linux-musl
            # Ubuntu has no unversioned gcc-loongarch64-linux-gnu meta package.
            packages: gcc-14-loongarch64-linux-gnu libc6-dev-loong64-cross
            cross_cc: loongarch64-linux-gnu-gcc-14
            script: ./scripts/cross-smoke.sh loongarch64
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust + cross targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Install ${{ matrix.arch }} cross compiler and qemu
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }} qemu-user

      - name: Cross-build and smoke-test ${{ matrix.arch }} under qemu
        env:
          CROSS_CC: ${{ matrix.cross_cc }}
        run: ${{ matrix.script }}
