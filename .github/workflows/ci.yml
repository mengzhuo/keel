# CI is also the release gate: release.yml calls this workflow through
# workflow_call, so every job here must be blocking.
#
# Job graph:
#
#   precheck
#     ├── fmt-lint:     fmt -> lint
#     └── header-macro: header -> macro-parity   (header waits for fmt)
#          │
#          ├──> build-and-test    (native x86_64 + aarch64)
#          ├──> libc-test-cross   (qemu: aarch64/riscv64/ppc64le/loongarch64)
#          └──> cross-arch        (qemu smoke: riscv64/ppc64le/loongarch64)
#                     │
#                     v
#                 ci-status
#
# `ci-status` is the single check to require in branch protection: it only
# succeeds when the precheck group and every build/test job succeeded.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TEST_THREADS: "1"

jobs:
  # Precheck is a reusable workflow so the four fast correctness gates stay
  # one unit in the CI graph: header, fmt, lint and macro-parity.
  precheck:
    name: precheck
    permissions:
      contents: read
    uses: ./.github/workflows/precheck.yml

  build-and-test:
    needs: precheck
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            os: ubuntu-latest
          # Native arm64 runners.
          - arch: aarch64
            os: ubuntu-24.04-arm
          # Native riscv64 hardware from the RISE RISC-V Runners service.
          # Requires the RISE GitHub App: https://github.com/apps/rise-risc-v-runners
          # Disabled for now: the runner does not come up. Re-enable together
          # with the riscv64-only steps below.
          # - arch: riscv64
          #   os: ubuntu-24.04-riscv
    runs-on: ${{ matrix.os }}
    timeout-minutes: 360
    env:
      LIBC_TEST_DIR: /tmp/libc-test
      # Pin upstream libc-test so an unrelated commit cannot change results.
      LIBC_TEST_SHA: b7ec467969a53756258778fa7d9b045f912d1c93
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install musl-tools
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-${{ matrix.arch }}-cargo-registry-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}

      - name: Resolve libc-test revision
        id: libc_test
        run: echo "sha=$LIBC_TEST_SHA" >> "$GITHUB_OUTPUT"

      - name: Cache libc-test sources
        uses: actions/cache@v6
        with:
          path: /tmp/libc-test
          key: libc-test-v2-${{ runner.os }}-${{ matrix.arch }}-${{ steps.libc_test.outputs.sha }}

      - name: Fetch libc-test sources
        run: |
          if [ ! -d /tmp/libc-test/src ] || \
             [ "$(git -C /tmp/libc-test rev-parse HEAD 2>/dev/null)" != "${{ steps.libc_test.outputs.sha }}" ]; then
            rm -rf /tmp/libc-test
            git init -q /tmp/libc-test
            git -C /tmp/libc-test remote add origin https://github.com/kraj/libc-test
            git -C /tmp/libc-test fetch -q --depth 1 origin "${{ steps.libc_test.outputs.sha }}"
            git -C /tmp/libc-test checkout -q --detach FETCH_HEAD
          fi

      - name: Build all artifacts
        run: cargo build --workspace

      - name: Run integration tests
        run: |
          set -o pipefail
          cargo test --workspace --no-fail-fast 2>&1 | tee /tmp/integration-tests.log

      - name: Report failed tests
        if: failure()
        run: |
          grep -E '^test .* FAILED|FAILED|panicked at|error: test failed' /tmp/integration-tests.log | tail -80 | while IFS= read -r line; do
            echo "::error::$line"
          done

      - name: Install riscv64 musl target
        if: matrix.arch == 'riscv64'
        run: rustup target add riscv64gc-unknown-linux-musl

      - name: Run riscv64 smoke suite natively
        if: matrix.arch == 'riscv64'
        env:
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
        run: ./scripts/riscv-smoke.sh

      # regression/functional run inside cargo test via tests/libc_test_regression.rs
      # and libc_test_functional.rs.
      - name: Run libc-test API suite
        run: |
          cd scripts/libc-test-harness
          ./run.sh api

      - name: Run libc-test math suite
        if: matrix.arch == 'x86_64'
        run: |
          cd scripts/libc-test-harness
          ./run.sh math

  # Cross-arch libc-test suites. Both matrices are blocking: together with
  # the native jobs they gate releases through ci-status.
  libc-test-cross:
    name: libc-test-cross (${{ matrix.arch }})
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: aarch64
            targets: aarch64-unknown-linux-gnu
            packages: gcc-aarch64-linux-gnu libc6-dev-arm64-cross
            cross_cc: aarch64-linux-gnu-gcc
          - arch: riscv64
            targets: riscv64gc-unknown-linux-gnu
            packages: gcc-riscv64-linux-gnu libc6-dev-riscv64-cross
            cross_cc: riscv64-linux-gnu-gcc
          - arch: powerpc64le
            targets: powerpc64le-unknown-linux-gnu
            packages: gcc-powerpc64le-linux-gnu libc6-dev-ppc64el-cross
            cross_cc: powerpc64le-linux-gnu-gcc
          - arch: loongarch64
            # Pin GCC 14: resolute's unversioned package selects GCC 15,
            # which has not been validated for this port yet.
            targets: loongarch64-unknown-linux-gnu
            packages: gcc-14-loongarch64-linux-gnu libc6-dev-loong64-cross
            cross_cc: loongarch64-linux-gnu-gcc-14
    env:
      LIBC_TEST_DIR: /tmp/libc-test
      LIBC_TEST_SHA: b7ec467969a53756258778fa7d9b045f912d1c93
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust + target
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Install cross compiler, target libc and qemu
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }} qemu-user

      - name: Resolve libc-test revision
        id: libc_test
        run: echo "sha=$LIBC_TEST_SHA" >> "$GITHUB_OUTPUT"

      - name: Cache libc-test sources
        uses: actions/cache@v6
        with:
          path: /tmp/libc-test
          key: libc-test-v2-${{ runner.os }}-${{ matrix.arch }}-${{ steps.libc_test.outputs.sha }}

      - name: Fetch libc-test sources
        run: |
          if [ ! -d /tmp/libc-test/src ] || \
             [ "$(git -C /tmp/libc-test rev-parse HEAD 2>/dev/null)" != "$LIBC_TEST_SHA" ]; then
            rm -rf /tmp/libc-test
            git init -q /tmp/libc-test
            git -C /tmp/libc-test remote add origin https://github.com/kraj/libc-test
            git -C /tmp/libc-test fetch -q --depth 1 origin "$LIBC_TEST_SHA"
            git -C /tmp/libc-test checkout -q --detach FETCH_HEAD
          fi

      - name: Run functional, regression and API suites
        env:
          CROSS_CC: ${{ matrix.cross_cc }}
        run: |
          set -e
          ./scripts/libc-test-harness/cross-run.sh ${{ matrix.arch }} functional
          ./scripts/libc-test-harness/cross-run.sh ${{ matrix.arch }} regression
          ./scripts/libc-test-harness/cross-run.sh ${{ matrix.arch }} api

  cross-arch:
    name: cross-arch (${{ matrix.arch }})
    needs: precheck
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: riscv64
            targets: riscv64gc-unknown-linux-musl
            packages: gcc-riscv64-linux-gnu
            cross_cc: ""
            script: ./scripts/riscv-smoke.sh
          - arch: powerpc64le
            # libc.so is built for the gnu target: the stable musl targets
            # cannot emit a cdylib.  The musl target supplies the CRT objects.
            targets: powerpc64le-unknown-linux-gnu,powerpc64le-unknown-linux-musl
            packages: gcc-powerpc64le-linux-gnu libc6-dev-ppc64el-cross
            cross_cc: ""
            script: ./scripts/cross-smoke.sh powerpc64le
          - arch: loongarch64
            # Pin GCC 14: resolute's unversioned package selects GCC 15,
            # which has not been validated for this port yet.
            targets: loongarch64-unknown-linux-gnu,loongarch64-unknown-linux-musl
            packages: gcc-14-loongarch64-linux-gnu libc6-dev-loong64-cross
            cross_cc: loongarch64-linux-gnu-gcc-14
            script: ./scripts/cross-smoke.sh loongarch64
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust + cross targets
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.targets }}

      - name: Install ${{ matrix.arch }} cross compiler and qemu
        run: sudo apt-get update && sudo apt-get install -y ${{ matrix.packages }} qemu-user

      - name: Cross-build and smoke-test ${{ matrix.arch }} under qemu
        env:
          CROSS_CC: ${{ matrix.cross_cc }}
        run: ${{ matrix.script }}

  # Aggregate gate. `if: always()` makes this run even when an upstream job
  # failed or was skipped, so the workflow (and a release that calls it)
  # cannot pass on a partial matrix.
  ci-status:
    name: CI status
    if: always()
    needs: [precheck, build-and-test, libc-test-cross, cross-arch]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every CI job to succeed
        run: |
          set -euo pipefail
          failed=0
          while IFS='=' read -r name result; do
            if [ "$result" != "success" ]; then
              echo "::error::$name did not succeed (result: $result)"
              failed=1
            fi
          done <<'RESULTS'
          precheck=${{ needs.precheck.result }}
          build-and-test=${{ needs.build-and-test.result }}
          libc-test-cross=${{ needs.libc-test-cross.result }}
          cross-arch=${{ needs.cross-arch.result }}
          RESULTS
          if [ "$failed" -ne 0 ]; then
            exit 1
          fi
          echo "All CI jobs succeeded."
