# Release order:
#
#   verify-version (fast) -> gate (reuse the CI run for this commit) -> publish
#
# `publish` has no path around `gate`: if the tagged commit has no successful
# ci.yml run, `publish` is skipped and nothing is published.

name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write   # create the GitHub release
  id-token: write   # mint the short-lived crates.io token via OIDC

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Cheap preflight: reject a tag whose version does not match the manifests
  # before spending an hour on the test matrix.
  verify-version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Verify tag matches workspace versions
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cargo metadata --no-deps --format-version 1 > /tmp/metadata.json
          for pkg in keel-rt keel-libc keel-utils; do
            got=$(jq -r --arg p "$pkg" '.packages[] | select(.name == $p) | .version' /tmp/metadata.json)
            if [ "$got" != "$version" ]; then
              echo "::error::$pkg is version $got but tag $GITHUB_REF_NAME expects $version"
              exit 1
            fi
          done
          echo "Publishing version $version"

  # Release gate: reuse the CI run that already covers this exact commit.  A
  # tag is releasable only when the `CI status` aggregate of the `main` push
  # run for the tagged SHA has completed successfully (precheck, native tests,
  # workloads, cross and qemu suites).  This never starts another CI run.
  gate:
    needs: verify-version
    permissions:
      checks: read
      contents: read
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - name: Require a successful CI run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail

          # `CI status` is the aggregate job at the end of ci.yml.  The
          # unprefixed name identifies the main push run; a nested release
          # run would be reported as `ci / CI status`.
          status=""
          conclusion=""
          url=""
          for attempt in $(seq 1 360); do
            line=$(gh api \
              "repos/$GITHUB_REPOSITORY/commits/$SHA/check-runs?per_page=100" \
              --jq '[.check_runs[] | select(.name == "CI status")]
                    | sort_by(.id) | last
                    | if . == null then empty
                      else [.status, .conclusion, .html_url] | @tsv
                      end')
            if [ -n "$line" ]; then
              IFS=$'\t' read -r status conclusion url <<< "$line"
              if [ "$status" = "completed" ]; then
                break
              fi
            fi
            if [ "$attempt" -lt 360 ]; then
              echo "CI status for $SHA is ${status:-not created yet} (attempt $attempt/360); waiting..."
              sleep 15
            fi
          done

          if [ "$status" != "completed" ]; then
            echo "::error::Timed out waiting for the CI status of $SHA."
            echo "Push the commit to main and wait for CI before creating the release tag."
            exit 1
          fi
          if [ "$conclusion" != "success" ]; then
            echo "::error::CI status for $SHA is $conclusion: $url"
            exit 1
          fi
          echo "CI status for $SHA succeeded: $url"

  publish:
    needs: [verify-version, gate]
    runs-on: ubuntu-latest
    # Must match the "Environment" field of the trusted publisher configured
    # on crates.io for keel-rt, keel-libc and keel-utils.
    environment: release
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install musl, cross toolchains and targets
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu
          rustup target add \
            x86_64-unknown-linux-musl \
            aarch64-unknown-linux-musl \
            aarch64-unknown-linux-gnu \
            riscv64gc-unknown-linux-musl \
            powerpc64le-unknown-linux-musl \
            loongarch64-unknown-linux-musl

      - name: Build release artifacts
        run: |
          set -eux
          cargo build --release -p keel-libc --target x86_64-unknown-linux-gnu
          CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER=musl-gcc \
            cargo build --release -p keel-rt --target x86_64-unknown-linux-musl
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=aarch64-linux-gnu-gcc \
            cargo build --release -p keel-libc --target aarch64-unknown-linux-gnu
          CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER=aarch64-linux-gnu-gcc \
            cargo build --release -p keel-rt --target aarch64-unknown-linux-musl
          CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_MUSL_LINKER=riscv64-linux-gnu-gcc \
            cargo build --release --workspace --target riscv64gc-unknown-linux-musl
          lld="$(rustc --print sysroot)/lib/rustlib/$(rustc -vV | sed -n 's/^host: //p')/bin/rust-lld"
          RUSTFLAGS="-C target-feature=+crt-static -C link-self-contained=yes -C linker=$lld" \
            CARGO_TARGET_RISCV64GC_UNKNOWN_LINUX_MUSL_LINKER="$lld" \
            cargo build --release -p keel-rt --target riscv64gc-unknown-linux-musl

      - name: Build Rust CRT objects and keel-utils
        run: |
          set -o pipefail
          ./scripts/build-crt.sh > /tmp/crt-build.log 2>&1 || {
            tail -40 /tmp/crt-build.log | sed 's/^/::error::/'
            exit 1
          }
          ./scripts/build-utils.sh > /tmp/utils-build.log 2>&1 || {
            tail -10 /tmp/utils-build.log | sed 's/^/::error::/'
            exit 1
          }

      - name: Build Alpine packages
        env:
          # Optional RSA key (apk-tools format, base64-encoded) for package
          # signatures.  When the secret is absent the packages are unsigned
          # and the release still publishes SHA256SUMS.
          APK_SIGN_KEY_B64: ${{ secrets.APK_SIGN_KEY_B64 }}
        run: |
          set -euo pipefail
          export SOURCE_DATE_EPOCH="$(git log -1 --format=%ct)"
          if [ -n "${APK_SIGN_KEY_B64:-}" ]; then
            key="$RUNNER_TEMP/keel-apk-signing-key"
            printf '%s' "$APK_SIGN_KEY_B64" | base64 -d > "$key"
            chmod 600 "$key"
            export APK_SIGN_KEY="$key"
            echo "signing APK packages"
          else
            echo "APK_SIGN_KEY_B64 is not configured; packages will be unsigned"
          fi
          ./scripts/package-apk.sh

      - name: Smoke-test keel-utils
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eux
          version="${VERSION#v}"
          docker run --rm -v "$PWD/dist:/dist:ro" alpine:3.23 sh -c "
            apk add --allow-untrusted \
              /dist/keel-${version}-r0.x86_64.apk \
              /dist/keel-utils-${version}-r0.x86_64.apk
            keel-utils getconf PAGESIZE >/dev/null
            ldd /bin/busybox >/dev/null
          "

      - name: Smoke-test the packaged libc
        env:
          VERSION: ${{ github.ref_name }}
        run: |
          set -eux
          version="${VERSION#v}"
          musl-gcc -fPIE -pie -D_GNU_SOURCE -I include \
            -Wl,--dynamic-linker=/usr/lib/keel/libc.so \
            -L target/x86_64-unknown-linux-gnu/release \
            tests/fixtures/compat_test.c -Wl,--allow-shlib-undefined -lpthread -lc \
            -o /tmp/compat_apk
          docker run --rm --network=none \
            -v "$PWD/dist:/dist:ro" -v "/tmp:/work:ro" alpine:3.23 sh -c "
              apk --no-network add --allow-untrusted /dist/keel-${version}-r0.x86_64.apk
              mkdir -p /tmp/keeltest && touch /tmp/keeltest/seed
              LD_LIBRARY_PATH=/usr/lib/keel /work/compat_apk
            "

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@v1

      # Publishing is idempotent: re-running the workflow for a tag whose
      # crates are already on crates.io skips them instead of failing.
      - name: Publish keel-libc
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -A 'keel-release (+https://github.com/mengzhuo/keel)' \
            "https://crates.io/api/v1/crates/keel-libc/$version")
          case "$code" in
            200) echo "keel-libc $version is already published; skipping" ;;
            404) RUSTFLAGS='-C panic=abort' cargo publish -p keel-libc --registry crates-io ;;
            *) echo "::error::unexpected crates.io status $code"; exit 1 ;;
          esac

      - name: Publish keel
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -A 'keel-release (+https://github.com/mengzhuo/keel)' \
            "https://crates.io/api/v1/crates/keel-rt/$version")
          case "$code" in
            200) echo "keel $version is already published; skipping" ;;
            404) cargo publish -p keel-rt --registry crates-io ;;
            *) echo "::error::unexpected crates.io status $code"; exit 1 ;;
          esac

      - name: Publish keel-utils
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          code=$(curl -s -o /dev/null -w '%{http_code}' \
            -A 'keel-release (+https://github.com/mengzhuo/keel)' \
            "https://crates.io/api/v1/crates/keel-utils/$version")
          case "$code" in
            200) echo "keel-utils $version is already published; skipping" ;;
            404) cargo publish -p keel-utils --registry crates-io ;;
            *) echo "::error::unexpected crates.io status $code"; exit 1 ;;
          esac

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1 || \
            gh release create "$GITHUB_REF_NAME" --generate-notes --verify-tag
          gh release upload "$GITHUB_REF_NAME" dist/*.apk dist/SHA256SUMS --clobber
