# Publish the multi-arch keel Alpine image to Docker Hub.
#
# Runs when a GitHub release is published, and can be dispatched manually with
# a version (without the leading "v") to backfill an older release.  Requires
# the repository secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN.

name: Docker image

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      version:
        description: "Release version without the leading v (for example 0.1.6)"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: docker-${{ github.event.release.tag_name || inputs.version || github.run_id }}
  cancel-in-progress: false

jobs:
  publish:
    name: publish
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Resolve image version
        id: version
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          version="${INPUT_VERSION:-${RELEASE_TAG#v}}"
          if ! printf '%s\n' "$version" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::invalid release version '$version'"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64,linux/riscv64
          push: true
          tags: mengzhuo/keel-alpine:${{ steps.version.outputs.version }}
          build-args: |
            KEEL_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
