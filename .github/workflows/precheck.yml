# Fast precheck group, called by ci.yml before the build and qemu jobs start.
#
#   fmt -> lint
#   fmt -> header
#
# The slower macro/inline parity checks live in parity.yml and run in parallel
# with the build, so they no longer gate the build's critical path.  `fmt`
# stays in front of `lint` and `header` so a style failure is reported before
# the slower checks; `header` and `lint` are independent of each other.

name: Precheck

on:
  workflow_call:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  # The hand-maintained headers and the Rust sources are independent sources
  # of truth, so fail fast if a numeric macro drifts.
  header:
    name: precheck / header
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install cross compilers
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            gcc-aarch64-linux-gnu gcc-riscv64-linux-gnu

      - name: Check headers against Rust constants
        run: cargo run -q -p keel-header-check -- --include include

  fmt:
    name: precheck / fmt
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust with rustfmt
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Check Rust formatting
        run: cargo fmt --all --check

  # scripts/lint.sh holds the normal Rust crates to -D warnings and checks
  # keel-libc's correctness lints while allowing the intentional style lints
  # from its literal musl port.
  lint:
    name: precheck / lint
    needs: fmt
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - name: Install stable Rust with clippy
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry
        uses: actions/cache@v6
        with:
          path: ~/.cargo/registry
          key: ${{ runner.os }}-x86_64-cargo-registry-${{ hashFiles('**/Cargo.toml', 'rust-toolchain.toml') }}
          restore-keys: |
            ${{ runner.os }}-x86_64-cargo-registry-

      - name: Run Rust lints
        run: ./scripts/lint.sh
